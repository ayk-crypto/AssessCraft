name: Verify AssessCraft Free 0.18.2 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-0182-release.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-assesscraft-free-0.18.2
  cancel-in-progress: false

jobs:
  verify:
    name: Download and verify published assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify release and downloadable files
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.18.2
          ZIP: assesscraft-free-0.18.2.zip
          CHECKSUM: assesscraft-free-0.18.2.zip.sha256
        run: |
          set -euo pipefail

          release_json="$(gh release view "$TAG" --json tagName,isDraft,isPrerelease,url,assets)"
          jq -e '.tagName == "v0.18.2"' <<<"$release_json" >/dev/null
          jq -e '.isDraft == false and .isPrerelease == false' <<<"$release_json" >/dev/null
          jq -e '([.assets[].name] | contains(["assesscraft-free-0.18.2.zip", "assesscraft-free-0.18.2.zip.sha256"]))' <<<"$release_json" >/dev/null

          mkdir -p release-verification
          gh release download "$TAG" \
            --pattern 'assesscraft-free-0.18.2.zip*' \
            --dir release-verification

          cd release-verification
          test -s "$ZIP"
          test -s "$CHECKSUM"
          sha256sum --check "$CHECKSUM"
          unzip -t "$ZIP"
          unzip -p "$ZIP" assesscraft/assesscraft.php | grep -Eq '^ \* Version:[[:space:]]+0\.18\.2$'
          ! unzip -l "$ZIP" | grep -E '(/tests/|/docs/|/vendor/|/node_modules/|/\.github/|/\.wordpress-org/|composer\.(json|lock)|phpunit\.xml|phpcs\.xml|RELEASE_NOTES\.md|CHECKSUMS\.txt)'

          digest="$(sha256sum "$ZIP" | awk '{print $1}')"
          release_url="$(jq -r '.url' <<<"$release_json")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"

      - name: Record audit result on publication PR
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          DIGEST: ${{ steps.verify.outputs.digest }}
          RELEASE_URL: ${{ steps.verify.outputs.release_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$VERIFY_OUTCOME" == "success" ]]; then
            gh pr comment 23 --body "✅ **AssessCraft Free 0.18.2 release audit passed**

- Published release: v0.18.2
- Assets present: \`assesscraft-free-0.18.2.zip\` and \`assesscraft-free-0.18.2.zip.sha256\`
- SHA-256 verification: passed
- ZIP integrity test: passed
- Packaged plugin version: 0.18.2
- Development-file exclusion check: passed
- Verified digest: \`$DIGEST\`
- Audit run: $RUN_URL"
          else
            gh pr comment 23 --body "❌ **AssessCraft Free 0.18.2 release audit failed**

The independent download, checksum, or ZIP verification did not complete successfully. Review the audit run before using the public download link:

$RUN_URL"
            exit 1
          fi
