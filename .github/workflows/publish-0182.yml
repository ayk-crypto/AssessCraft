name: Finalize AssessCraft Free 0.18.2 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-0182.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: finalize-assesscraft-free-0.18.2
  cancel-in-progress: false

jobs:
  finalize:
    name: Build clean tagged package and verify release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@v4
        with:
          ref: v0.18.2
          fetch-depth: 0

      - name: Verify tag belongs to protected main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          tag_sha="$(git rev-list -n 1 v0.18.2)"
          git merge-base --is-ancestor "$tag_sha" origin/main
          test "$(git rev-parse HEAD)" = "$tag_sha"
          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^ \* Version:[[:space:]]+0\.18\.2$' assesscraft.php
          grep -Fq "define( 'ASSESSCRAFT_VERSION', '0.18.2' );" assesscraft.php
          grep -Fq '# AssessCraft Free 0.18.2' RELEASE_NOTES.md
          grep -Fq 'Stable tag: 0.18.2' readme.txt

      - name: Build clean package from tag
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/assesscraft
          rsync -a \
            --exclude '.git' \
            --exclude '.gitignore' \
            --exclude '.editorconfig' \
            --exclude '.github/' \
            --exclude '.wordpress-org/' \
            --exclude 'build/' \
            --exclude 'docs/' \
            --exclude 'tests/' \
            --exclude 'vendor/' \
            --exclude 'node_modules/' \
            --exclude 'composer.json' \
            --exclude 'composer.lock' \
            --exclude 'README.md' \
            --exclude 'RELEASE_NOTES.md' \
            --exclude 'CHECKSUMS.txt' \
            --exclude 'php*.xml*' \
            --exclude '.phpunit.result.cache' \
            --exclude '.phpunit.cache/' \
            --exclude '.phpcs-cache' \
            --exclude '.phpcs-cache-*' \
            --exclude 'coverage/' \
            --exclude '*.zip' \
            ./ build/assesscraft/

          cd build
          zip -qr assesscraft-free-0.18.2.zip assesscraft
          sha256sum assesscraft-free-0.18.2.zip > assesscraft-free-0.18.2.zip.sha256

      - name: Verify clean package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ZIP='build/assesscraft-free-0.18.2.zip'
          CHECKSUM='build/assesscraft-free-0.18.2.zip.sha256'

          unzip -t "$ZIP"
          (
            cd build
            sha256sum --check assesscraft-free-0.18.2.zip.sha256
          )
          unzip -p "$ZIP" assesscraft/assesscraft.php | grep -Eq '^ \* Version:[[:space:]]+0\.18\.2$'
          ! unzip -l "$ZIP" | grep -E '(/tests/|/docs/|/vendor/|/node_modules/|/\.github/|/\.wordpress-org/|composer\.(json|lock)|phpunit\.xml|phpcs\.xml|RELEASE_NOTES\.md|CHECKSUMS\.txt|\.phpunit\.result\.cache|/\.phpunit\.cache/|\.phpcs-cache|/coverage/)'

          digest="$(sha256sum "$ZIP" | awk '{print $1}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate release metadata
        shell: bash
        env:
          DIGEST: ${{ steps.package.outputs.digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          digest = os.environ['DIGEST']
          zip_name = 'assesscraft-free-0.18.2.zip'
          checksum_line = f'{digest}  {zip_name}'

          notes = Path('RELEASE_NOTES.md').read_text(encoding='utf-8')
          notes = notes.replace(
              '`Generated by the protected release workflow`',
              f'`{checksum_line}`',
          )
          Path('build/RELEASE_NOTES-0.18.2.md').write_text(notes, encoding='utf-8')
          Path('build/CHECKSUMS.txt').write_text(checksum_line + '\n', encoding='utf-8')
          PY

      - name: Replace release assets with clean tagged build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.18.2
        run: |
          set -euo pipefail
          release_json="$(gh release view "$TAG" --json tagName,isDraft,isPrerelease,targetCommitish)"
          jq -e '.tagName == "v0.18.2"' <<<"$release_json" >/dev/null
          jq -e '.isDraft == false and .isPrerelease == false' <<<"$release_json" >/dev/null

          gh release upload "$TAG" \
            build/assesscraft-free-0.18.2.zip \
            build/assesscraft-free-0.18.2.zip.sha256 \
            build/CHECKSUMS.txt \
            --clobber

          gh release edit "$TAG" \
            --title 'AssessCraft Free 0.18.2' \
            --notes-file build/RELEASE_NOTES-0.18.2.md \
            --latest

      - name: Download and independently verify public release
        id: public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.18.2
          EXPECTED_DIGEST: ${{ steps.package.outputs.digest }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$TAG" --json tagName,isDraft,isPrerelease,url,body,assets)"
          jq -e '.tagName == "v0.18.2"' <<<"$release_json" >/dev/null
          jq -e '.isDraft == false and .isPrerelease == false' <<<"$release_json" >/dev/null
          jq -e '([.assets[].name] | contains(["assesscraft-free-0.18.2.zip", "assesscraft-free-0.18.2.zip.sha256", "CHECKSUMS.txt"]))' <<<"$release_json" >/dev/null
          jq -e --arg digest "$EXPECTED_DIGEST" '.body | contains($digest)' <<<"$release_json" >/dev/null

          rm -rf public-release
          mkdir -p public-release
          gh release download "$TAG" \
            --pattern 'assesscraft-free-0.18.2.zip*' \
            --dir public-release
          gh release download "$TAG" \
            --pattern 'CHECKSUMS.txt' \
            --dir public-release

          cd public-release
          test -s assesscraft-free-0.18.2.zip
          test -s assesscraft-free-0.18.2.zip.sha256
          test -s CHECKSUMS.txt
          sha256sum --check assesscraft-free-0.18.2.zip.sha256
          actual_digest="$(sha256sum assesscraft-free-0.18.2.zip | awk '{print $1}')"
          test "$actual_digest" = "$EXPECTED_DIGEST"
          grep -Fxq "$actual_digest  assesscraft-free-0.18.2.zip" CHECKSUMS.txt
          unzip -t assesscraft-free-0.18.2.zip
          unzip -p assesscraft-free-0.18.2.zip assesscraft/assesscraft.php | grep -Eq '^ \* Version:[[:space:]]+0\.18\.2$'
          ! unzip -l assesscraft-free-0.18.2.zip | grep -E '(\.phpunit\.result\.cache|/\.phpunit\.cache/|\.phpcs-cache|/coverage/)'

          release_url="$(jq -r '.url' <<<"$release_json")"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"

      - name: Record final release audit
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          PUBLIC_OUTCOME: ${{ steps.public.outcome }}
          DIGEST: ${{ steps.package.outputs.digest }}
          RELEASE_URL: ${{ steps.public.outputs.release_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$PACKAGE_OUTCOME" == "success" && "$PUBLIC_OUTCOME" == "success" ]]; then
            gh pr comment 23 --body "✅ **AssessCraft Free 0.18.2 final release audit passed**

- Built from immutable tag: \`v0.18.2\`
- Clean ZIP republished without test caches or development files
- SHA-256 sidecar verified
- \`CHECKSUMS.txt\` verified
- Release notes contain the verified digest
- Public ZIP downloaded and archive-tested
- Verified SHA-256: \`$DIGEST\`
- Release: $RELEASE_URL
- Audit run: $RUN_URL"
          else
            gh pr comment 23 --body "❌ **AssessCraft Free 0.18.2 final release audit failed**

The clean tagged rebuild or public download verification failed. Do not activate the website download until this run is corrected:

$RUN_URL"
            exit 1
          fi
