name: Publish AssessCraft Free 0.18.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-0182.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-assesscraft-free-0.18.2
  cancel-in-progress: false

jobs:
  publish:
    name: Validate, package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out protected main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve immutable release source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.18.2
        run: |
          set -euo pipefail
          git fetch origin main --tags --force

          if gh release view "$TAG" >/dev/null 2>&1; then
            source_sha="$(git rev-list -n 1 "$TAG")"
            git merge-base --is-ancestor "$source_sha" origin/main
            release_exists=true
          else
            source_sha="$(git rev-parse origin/main)"
            release_exists=false
          fi

          git checkout --detach "$source_sha"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "release_exists=$release_exists" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^ \* Version:[[:space:]]+0\.18\.2$' assesscraft.php
          grep -Fq "define( 'ASSESSCRAFT_VERSION', '0.18.2' );" assesscraft.php
          grep -Fq 'Current stable version: `0.18.2`.' README.md
          grep -Fq '# AssessCraft Free 0.18.2' RELEASE_NOTES.md
          grep -Fq 'Stable tag: 0.18.2' readme.txt

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './build/*' \
            -print0 | xargs -0 -n1 php -l

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -not -path './build/*' \
            -print0)

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          excluded = {'.git', 'vendor', 'node_modules', 'build'}
          for path in Path('.').rglob('*.json'):
              if excluded.intersection(path.parts):
                  continue
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
              print(f'Valid JSON: {path}')
          PY

      - name: Run repository PHP quality checks
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f composer.json ]]; then
            composer install --no-interaction --prefer-dist --no-progress
            if [[ -x vendor/bin/phpunit ]]; then
              vendor/bin/phpunit
            fi
            if [[ -x vendor/bin/phpcs ]]; then
              vendor/bin/phpcs
            fi
          fi

      - name: Build clean release package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/assesscraft
          rsync -a \
            --exclude '.git' \
            --exclude '.gitignore' \
            --exclude '.editorconfig' \
            --exclude '.github/' \
            --exclude '.wordpress-org/' \
            --exclude 'build/' \
            --exclude 'docs/' \
            --exclude 'tests/' \
            --exclude 'vendor/' \
            --exclude 'node_modules/' \
            --exclude 'composer.*' \
            --exclude 'README.md' \
            --exclude 'RELEASE_NOTES.md' \
            --exclude 'CHECKSUMS.txt' \
            --exclude 'php*.xml*' \
            --exclude '*.zip' \
            ./ build/assesscraft/
          cd build
          zip -qr assesscraft-free-0.18.2.zip assesscraft
          sha256sum assesscraft-free-0.18.2.zip > assesscraft-free-0.18.2.zip.sha256

      - name: Verify locally built package
        shell: bash
        run: |
          set -euo pipefail
          unzip -t build/assesscraft-free-0.18.2.zip
          cd build
          sha256sum --check assesscraft-free-0.18.2.zip.sha256
          ! unzip -l assesscraft-free-0.18.2.zip | grep -E '(/tests/|/docs/|/vendor/|/node_modules/|/\.github/|/\.wordpress-org/|composer\.(json|lock)|phpunit\.xml|phpcs\.xml|RELEASE_NOTES\.md|CHECKSUMS\.txt)'
          unzip -l assesscraft-free-0.18.2.zip | grep -F 'assesscraft/assesscraft.php'

      - name: Publish or validate immutable release
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.18.2
          ZIP: assesscraft-free-0.18.2.zip
          CHECKSUM: assesscraft-free-0.18.2.zip.sha256
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          RELEASE_EXISTS: ${{ steps.source.outputs.release_exists }}
        run: |
          set -euo pipefail
          mkdir -p release-existing

          if [[ "$RELEASE_EXISTS" == "true" ]]; then
            gh release download "$TAG" \
              --pattern 'assesscraft-free-0.18.2.zip*' \
              --dir release-existing

            test -s "release-existing/$ZIP"
            test -s "release-existing/$CHECKSUM"
            (
              cd release-existing
              sha256sum --check "$CHECKSUM"
            )

            rm -rf release-existing/extracted
            mkdir -p release-existing/extracted
            unzip -q "release-existing/$ZIP" -d release-existing/extracted
            diff -qr release-existing/extracted/assesscraft build/assesscraft
            digest="$(sha256sum "release-existing/$ZIP" | awk '{print $1}')"
          else
            digest="$(sha256sum "build/$ZIP" | awk '{print $1}')"
          fi

          python3 - "$digest" "$ZIP" <<'PY'
          from pathlib import Path
          import sys

          digest, zip_name = sys.argv[1], sys.argv[2]
          notes = Path('RELEASE_NOTES.md').read_text(encoding='utf-8')
          notes = notes.replace(
              '`Generated by the protected release workflow`',
              f'`{digest}  {zip_name}`',
          )
          Path('build/RELEASE_NOTES-0.18.2.md').write_text(notes, encoding='utf-8')
          Path('build/CHECKSUMS.txt').write_text(
              f'{digest}  {zip_name}\n',
              encoding='utf-8',
          )
          PY

          if [[ "$RELEASE_EXISTS" == "true" ]]; then
            gh release upload "$TAG" build/CHECKSUMS.txt --clobber
            gh release edit "$TAG" \
              --title 'AssessCraft Free 0.18.2' \
              --notes-file build/RELEASE_NOTES-0.18.2.md
          else
            gh release create "$TAG" \
              "build/$ZIP" \
              "build/$CHECKSUM" \
              build/CHECKSUMS.txt \
              --target "$SOURCE_SHA" \
              --title 'AssessCraft Free 0.18.2' \
              --notes-file build/RELEASE_NOTES-0.18.2.md \
              --latest
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Independently verify published release
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.18.2
          ZIP: assesscraft-free-0.18.2.zip
          CHECKSUM: assesscraft-free-0.18.2.zip.sha256
          EXPECTED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$TAG" --json tagName,isDraft,isPrerelease,url,assets)"
          jq -e '.tagName == "v0.18.2"' <<<"$release_json" >/dev/null
          jq -e '.isDraft == false and .isPrerelease == false' <<<"$release_json" >/dev/null
          jq -e '([.assets[].name] | contains(["assesscraft-free-0.18.2.zip", "assesscraft-free-0.18.2.zip.sha256", "CHECKSUMS.txt"]))' <<<"$release_json" >/dev/null

          rm -rf release-final
          mkdir -p release-final
          gh release download "$TAG" \
            --pattern 'assesscraft-free-0.18.2.zip*' \
            --dir release-final
          gh release download "$TAG" \
            --pattern 'CHECKSUMS.txt' \
            --dir release-final

          cd release-final
          sha256sum --check "$CHECKSUM"
          actual_digest="$(sha256sum "$ZIP" | awk '{print $1}')"
          test "$actual_digest" = "$EXPECTED_DIGEST"
          grep -Fxq "$actual_digest  $ZIP" CHECKSUMS.txt
          unzip -t "$ZIP"
          unzip -p "$ZIP" assesscraft/assesscraft.php | grep -Eq '^ \* Version:[[:space:]]+0\.18\.2$'

      - name: Record publication audit
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_OUTCOME" == "success" && "$VERIFY_OUTCOME" == "success" ]]; then
            gh pr comment 23 --body "✅ **AssessCraft Free 0.18.2 publication audit passed**

- Release tag: \`v0.18.2\`
- Published ZIP preserved and verified
- SHA-256 sidecar verified
- \`CHECKSUMS.txt\` published with the same digest
- Release notes updated with the generated digest
- ZIP integrity and packaged version verified
- Verified SHA-256: \`$DIGEST\`
- Audit run: $RUN_URL"
          else
            gh pr comment 23 --body "❌ **AssessCraft Free 0.18.2 publication audit failed**

The protected publication workflow did not complete all immutable-source, download, checksum, or archive checks. Review the run before using the public download:

$RUN_URL"
            exit 1
          fi
