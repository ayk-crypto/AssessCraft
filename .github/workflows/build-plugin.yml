name: Build installable plugin

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install production dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Read Free version
        run: |
          FREE_VERSION="$(sed -n 's/^ \* Version:[[:space:]]*//p' assesscraft.php | head -n1)"
          test -n "$FREE_VERSION"
          echo "FREE_VERSION=$FREE_VERSION" >> "$GITHUB_ENV"
          echo "FREE_ZIP=assesscraft-free-$FREE_VERSION.zip" >> "$GITHUB_ENV"

      - name: Assemble clean plugin directory
        run: |
          mkdir -p build/assesscraft
          rsync -a \
            --exclude '.git' \
            --exclude '.gitignore' \
            --exclude '.editorconfig' \
            --exclude '.github/' \
            --exclude '.wordpress-org/' \
            --exclude 'assesscraft-pro/' \
            --exclude 'build/' \
            --exclude 'docs/' \
            --exclude 'tests/' \
            --exclude 'composer.*' \
            --exclude 'README.md' \
            --exclude 'RELEASE_NOTES.md' \
            --exclude 'CHECKSUMS.txt' \
            --exclude 'php*.xml*' \
            --exclude '*.zip' \
            ./ build/assesscraft/

      - name: Create ZIP
        run: cd build && zip -qr "$FREE_ZIP" assesscraft

      - name: Verify ZIP
        run: |
          unzip -t "build/$FREE_ZIP"
          PACKAGED_VERSION="$(unzip -p "build/$FREE_ZIP" assesscraft/assesscraft.php | sed -n 's/^ \* Version:[[:space:]]*//p' | head -n1)"
          test "$PACKAGED_VERSION" = "$FREE_VERSION"
          unzip -p "build/$FREE_ZIP" assesscraft/readme.txt | grep -Fq "Stable tag: $FREE_VERSION"
          unzip -p "build/$FREE_ZIP" assesscraft/includes/class-assesscraft-features.php | grep -Fq "AssessCraft_Pro_License::is_active()"
          unzip -p "build/$FREE_ZIP" assesscraft/admin/assets/import-polish.js | grep -Fq "ac-json-upload-control"
          ! unzip -p "build/$FREE_ZIP" assesscraft/admin/assets/publish-feedback.js | grep -Fq "new MutationObserver"
          unzip -p "build/$FREE_ZIP" assesscraft/admin/assets/publish-feedback.js | grep -Fq "finite set of rechecks"
          unzip -p "build/$FREE_ZIP" assesscraft/includes/class-assesscraft-mail-diagnostics.php | grep -Fq "admin_post_assesscraft_send_test_email"
          unzip -p "build/$FREE_ZIP" assesscraft/includes/class-assesscraft-lead-endpoint.php | grep -Fq "AssessCraft_Mail_Diagnostics::send"
          ! unzip -l "build/$FREE_ZIP" | grep -E 'assesscraft-pro|/tests/|/docs/|composer\.json|phpunit\.xml|phpcs\.xml'

      - name: Create checksum
        run: cd build && sha256sum "$FREE_ZIP" > "$FREE_ZIP.sha256"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: assesscraft-plugin
          path: |
            build/assesscraft-free-*.zip
            build/assesscraft-free-*.zip.sha256
          if-no-files-found: error
          retention-days: 90
