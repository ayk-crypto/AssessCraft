name: Finalize and audit AssessCraft Free 0.18.2

on:
  pull_request:
    paths:
      - .github/workflows/audit-published-0182.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visible-finalize-assesscraft-free-0.18.2
  cancel-in-progress: false

jobs:
  finalize-and-audit:
    name: Finalize tagged release and verify public assets
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@v4
        with:
          ref: v0.18.2
          fetch-depth: 0

      - name: Verify immutable source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          tag_sha="$(git rev-list -n 1 v0.18.2)"
          git merge-base --is-ancestor "$tag_sha" origin/main
          test "$(git rev-parse HEAD)" = "$tag_sha"
          grep -Eq '^ \* Version:[[:space:]]+0\.18\.2$' assesscraft.php
          grep -Fq "define( 'ASSESSCRAFT_VERSION', '0.18.2' );" assesscraft.php
          echo "Release source: $tag_sha"

      - name: Build clean tagged package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/assesscraft
          rsync -a \
            --exclude '.git' \
            --exclude '.gitignore' \
            --exclude '.editorconfig' \
            --exclude '.github/' \
            --exclude '.wordpress-org/' \
            --exclude 'build/' \
            --exclude 'docs/' \
            --exclude 'tests/' \
            --exclude 'vendor/' \
            --exclude 'node_modules/' \
            --exclude 'composer.json' \
            --exclude 'composer.lock' \
            --exclude 'README.md' \
            --exclude 'RELEASE_NOTES.md' \
            --exclude 'CHECKSUMS.txt' \
            --exclude 'php*.xml*' \
            --exclude '.phpunit.result.cache' \
            --exclude '.phpunit.cache/' \
            --exclude '.phpcs-cache' \
            --exclude '.phpcs-cache-*' \
            --exclude 'coverage/' \
            --exclude '*.zip' \
            ./ build/assesscraft/

          cd build
          zip -qr assesscraft-free-0.18.2.zip assesscraft
          sha256sum assesscraft-free-0.18.2.zip > assesscraft-free-0.18.2.zip.sha256
          sha256sum --check assesscraft-free-0.18.2.zip.sha256
          unzip -t assesscraft-free-0.18.2.zip
          unzip -p assesscraft-free-0.18.2.zip assesscraft/assesscraft.php | grep -Eq '^ \* Version:[[:space:]]+0\.18\.2$'
          ! unzip -l assesscraft-free-0.18.2.zip | grep -E '(/tests/|/docs/|/vendor/|/node_modules/|/\.github/|/\.wordpress-org/|composer\.(json|lock)|phpunit\.xml|phpcs\.xml|RELEASE_NOTES\.md|\.phpunit\.result\.cache|/\.phpunit\.cache/|\.phpcs-cache|/coverage/)'

          digest="$(sha256sum assesscraft-free-0.18.2.zip | awk '{print $1}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Clean tagged ZIP SHA-256: $digest"

      - name: Generate checksum metadata
        shell: bash
        env:
          DIGEST: ${{ steps.package.outputs.digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          digest = os.environ['DIGEST']
          zip_name = 'assesscraft-free-0.18.2.zip'
          checksum_line = f'{digest}  {zip_name}'
          notes = Path('RELEASE_NOTES.md').read_text(encoding='utf-8')
          notes = notes.replace(
              '`Generated by the protected release workflow`',
              f'`{checksum_line}`',
          )
          Path('build/RELEASE_NOTES-0.18.2.md').write_text(notes, encoding='utf-8')
          Path('build/CHECKSUMS.txt').write_text(checksum_line + '\n', encoding='utf-8')
          PY

      - name: Publish definitive release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.18.2
        run: |
          set -euo pipefail
          release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease)"
          jq -e '.tagName == "v0.18.2"' <<<"$release_json" >/dev/null
          jq -e '.isDraft == false and .isPrerelease == false' <<<"$release_json" >/dev/null

          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            build/assesscraft-free-0.18.2.zip \
            build/assesscraft-free-0.18.2.zip.sha256 \
            build/CHECKSUMS.txt \
            --clobber

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title 'AssessCraft Free 0.18.2' \
            --notes-file build/RELEASE_NOTES-0.18.2.md \
            --latest

      - name: Download and verify live public release
        id: audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.18.2
          ZIP: assesscraft-free-0.18.2.zip
          SIDECAR: assesscraft-free-0.18.2.zip.sha256
          EXPECTED_DIGEST: ${{ steps.package.outputs.digest }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url,body,assets)"
          jq -e '.tagName == "v0.18.2"' <<<"$release_json" >/dev/null
          jq -e '.isDraft == false and .isPrerelease == false' <<<"$release_json" >/dev/null
          jq -e '([.assets[].name] | contains(["assesscraft-free-0.18.2.zip", "assesscraft-free-0.18.2.zip.sha256", "CHECKSUMS.txt"]))' <<<"$release_json" >/dev/null

          rm -rf audit
          mkdir -p audit
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'assesscraft-free-0.18.2.zip*' --dir audit
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'CHECKSUMS.txt' --dir audit

          cd audit
          sha256sum --check "$SIDECAR"
          digest="$(sha256sum "$ZIP" | awk '{print $1}')"
          test "$digest" = "$EXPECTED_DIGEST"
          grep -Fxq "$digest  $ZIP" CHECKSUMS.txt
          jq -e --arg digest "$digest" '.body | contains($digest)' <<<"$release_json" >/dev/null
          unzip -t "$ZIP"
          unzip -p "$ZIP" assesscraft/assesscraft.php | grep -Eq '^ \* Version:[[:space:]]+0\.18\.2$'
          ! unzip -l "$ZIP" | grep -E '(/tests/|/docs/|/vendor/|/node_modules/|/\.github/|/\.wordpress-org/|composer\.(json|lock)|phpunit\.xml|phpcs\.xml|RELEASE_NOTES\.md|\.phpunit\.result\.cache|/\.phpunit\.cache/|\.phpcs-cache|/coverage/)'

          release_url="$(jq -r '.url' <<<"$release_json")"
          zip_size="$(stat -c '%s' "$ZIP")"
          asset_names="$(jq -r '[.assets[].name] | sort | join(",")' <<<"$release_json")"

          echo "Public release: $release_url"
          echo "Public ZIP SHA-256: $digest"
          echo "Public ZIP bytes: $zip_size"
          echo "Public assets: $asset_names"

          {
            echo 'status=PASS'
            echo "tag=$TAG"
            echo 'version=0.18.2'
            echo "sha256=$digest"
            echo "zip_bytes=$zip_size"
            echo "release_url=$release_url"
            echo "assets=$asset_names"
            echo 'archive_integrity=PASS'
            echo 'checksum_sidecar=PASS'
            echo 'checksums_txt=PASS'
            echo 'release_notes_digest=PASS'
            echo 'development_cache_exclusion=PASS'
          } > release-audit.txt

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: assesscraft-0.18.2-public-release-audit
          path: audit/release-audit.txt
          if-no-files-found: error
          retention-days: 90
