name: Build installable AssessCraft Pro

on:
  workflow_dispatch:
  push:
    tags:
      - 'pro-v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble clean Pro directory
        run: |
          mkdir -p build/assesscraft-pro
          rsync -a \
            --exclude '.git' \
            --exclude '.DS_Store' \
            --exclude '*.zip' \
            assesscraft-pro/ build/assesscraft-pro/

      - name: Create ZIP
        run: cd build && zip -qr assesscraft-pro-0.1.0-alpha.1.zip assesscraft-pro

      - name: Verify ZIP
        run: |
          unzip -t build/assesscraft-pro-0.1.0-alpha.1.zip
          unzip -p build/assesscraft-pro-0.1.0-alpha.1.zip assesscraft-pro/assesscraft-pro.php | grep -Eq '^ \* Version:[[:space:]]+0\.1\.0-alpha\.1$'
          unzip -p build/assesscraft-pro-0.1.0-alpha.1.zip assesscraft-pro/assesscraft-pro.php | grep -Fq 'Requires Plugins: assesscraft'

      - name: Create checksum
        run: cd build && sha256sum assesscraft-pro-0.1.0-alpha.1.zip > assesscraft-pro-0.1.0-alpha.1.zip.sha256

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: assesscraft-pro-plugin
          path: |
            build/assesscraft-pro-0.1.0-alpha.1.zip
            build/assesscraft-pro-0.1.0-alpha.1.zip.sha256
          if-no-files-found: error
