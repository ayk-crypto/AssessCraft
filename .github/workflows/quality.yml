name: Release quality

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  unit:
    name: Unit tests and standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: composer lint

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: find . -type f -name '*.js' -not -path './node_modules/*' -not -path './vendor/*' -print0 | xargs -0 -n1 node --check

  package:
    name: Free package regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - name: Read Free version
        run: |
          FREE_VERSION="$(sed -n 's/^ \* Version:[[:space:]]*//p' assesscraft.php | head -n1)"
          test -n "$FREE_VERSION"
          echo "FREE_VERSION=$FREE_VERSION" >> "$GITHUB_ENV"
          echo "FREE_ZIP=assesscraft-free-$FREE_VERSION.zip" >> "$GITHUB_ENV"
      - name: Assemble Free package
        run: |
          mkdir -p build/assesscraft
          rsync -a --exclude '.git' --exclude '.gitignore' --exclude '.editorconfig' --exclude '.github/' --exclude '.wordpress-org/' --exclude 'assesscraft-pro/' --exclude 'build/' --exclude 'docs/' --exclude 'tests/' --exclude 'composer.*' --exclude 'README.md' --exclude 'RELEASE_NOTES.md' --exclude 'CHECKSUMS.txt' --exclude 'php*.xml*' --exclude '*.zip' ./ build/assesscraft/
          cd build && zip -qr "$FREE_ZIP" assesscraft
      - name: Verify Free package
        run: |
          unzip -t "build/$FREE_ZIP"
          PACKAGED_VERSION="$(unzip -p "build/$FREE_ZIP" assesscraft/assesscraft.php | sed -n 's/^ \* Version:[[:space:]]*//p' | head -n1)"
          test "$PACKAGED_VERSION" = "$FREE_VERSION"
          unzip -p "build/$FREE_ZIP" assesscraft/readme.txt | grep -Fq "Stable tag: $FREE_VERSION"
          unzip -p "build/$FREE_ZIP" assesscraft/includes/class-assesscraft-features.php | grep -Fq "AssessCraft_Pro_License::is_active()"
          unzip -p "build/$FREE_ZIP" assesscraft/admin/assets/import-polish.js | grep -Fq "ac-json-upload-control"
          ! unzip -p "build/$FREE_ZIP" assesscraft/admin/assets/publish-feedback.js | grep -Fq "new MutationObserver"
          unzip -p "build/$FREE_ZIP" assesscraft/admin/assets/publish-feedback.js | grep -Fq "finite set of rechecks"
          unzip -p "build/$FREE_ZIP" assesscraft/admin/assets/publish-feedback.js | grep -Fq "novalidate"
          unzip -p "build/$FREE_ZIP" assesscraft/admin/class-assesscraft-maintenance.php | grep -Fq "Publish through AssessCraft"
          unzip -p "build/$FREE_ZIP" assesscraft/admin/class-assesscraft-maintenance.php | grep -Fq "admin_post_assesscraft_publish_assessment"
          ! unzip -l "build/$FREE_ZIP" | grep -E '(assesscraft-pro|/tests/|/docs/|/\.wordpress-org/|composer\.json|phpunit\.xml|phpcs\.xml|RELEASE_NOTES\.md|CHECKSUMS\.txt)'
      - name: Create Free checksum
        run: cd build && sha256sum "$FREE_ZIP" > "$FREE_ZIP.sha256"
      - name: Retain validated Free package
        uses: actions/upload-artifact@v4
        with:
          name: assesscraft-free-plugin
          path: |
            build/assesscraft-free-*.zip
            build/assesscraft-free-*.zip.sha256
          if-no-files-found: error
          retention-days: 90

  plugin-check:
    name: WordPress Plugin Check — Free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact Free release contents
        run: |
          mkdir -p build/assesscraft
          rsync -a --exclude '.git' --exclude '.gitignore' --exclude '.editorconfig' --exclude '.github/' --exclude '.wordpress-org/' --exclude 'assesscraft-pro/' --exclude 'build/' --exclude 'docs/' --exclude 'tests/' --exclude 'composer.*' --exclude 'README.md' --exclude 'RELEASE_NOTES.md' --exclude 'CHECKSUMS.txt' --exclude 'php*.xml*' --exclude '*.zip' ./ build/assesscraft/
      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/assesscraft'

  pro-package:
    name: Pro package regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Pro version
        run: |
          PRO_VERSION="$(sed -n 's/^ \* Version:[[:space:]]*//p' assesscraft-pro/assesscraft-pro.php | head -n1)"
          test -n "$PRO_VERSION"
          echo "PRO_VERSION=$PRO_VERSION" >> "$GITHUB_ENV"
          echo "PRO_ZIP=assesscraft-pro-$PRO_VERSION.zip" >> "$GITHUB_ENV"
      - name: Assemble Pro package
        run: |
          mkdir -p build/assesscraft-pro
          rsync -a --exclude '.git' --exclude '.DS_Store' --exclude '*.zip' assesscraft-pro/ build/assesscraft-pro/
          cd build && zip -qr "$PRO_ZIP" assesscraft-pro
      - name: Verify Pro package
        run: |
          unzip -t "build/$PRO_ZIP"
          PACKAGED_VERSION="$(unzip -p "build/$PRO_ZIP" assesscraft-pro/assesscraft-pro.php | sed -n 's/^ \* Version:[[:space:]]*//p' | head -n1)"
          test "$PACKAGED_VERSION" = "$PRO_VERSION"
          ! unzip -p "build/$PRO_ZIP" assesscraft-pro/assesscraft-pro.php | grep -Fq 'Requires Plugins:'
          unzip -p "build/$PRO_ZIP" assesscraft-pro/readme.txt | grep -Fq "Stable tag: $PRO_VERSION"
          unzip -p "build/$PRO_ZIP" assesscraft-pro/includes/class-assesscraft-pro-dependencies.php | grep -Fq 'Complete setup to unlock Pro'
          ! unzip -l "build/$PRO_ZIP" | grep -E '(/tests/|/docs/|composer\.(json|lock)|phpunit\.xml|phpcs\.xml|\.DS_Store)'
      - name: Create Pro checksum
        run: cd build && sha256sum "$PRO_ZIP" > "$PRO_ZIP.sha256"
      - name: Retain validated Pro package
        uses: actions/upload-artifact@v4
        with:
          name: assesscraft-pro-plugin
          path: |
            build/assesscraft-pro-*.zip
            build/assesscraft-pro-*.zip.sha256
          if-no-files-found: error
          retention-days: 90

  pro-plugin-check:
    name: WordPress Plugin Check — Pro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Pro check copy
        run: |
          mkdir -p build/assesscraft-pro
          rsync -a --exclude '.git' --exclude '.DS_Store' --exclude '*.zip' assesscraft-pro/ build/assesscraft-pro/
      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/assesscraft-pro'