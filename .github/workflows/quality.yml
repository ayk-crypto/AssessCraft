name: Release quality

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  unit:
    name: Unit tests and standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: composer lint

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: find . -type f -name '*.js' -not -path './node_modules/*' -not -path './vendor/*' -print0 | xargs -0 -n1 node --check

  package:
    name: Free package regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - name: Assemble Free package
        run: |
          mkdir -p build/assesscraft
          rsync -a --exclude '.git' --exclude '.gitignore' --exclude '.editorconfig' --exclude '.github/' --exclude '.wordpress-org/' --exclude 'assesscraft-pro/' --exclude 'build/' --exclude 'docs/' --exclude 'tests/' --exclude 'composer.*' --exclude 'README.md' --exclude 'RELEASE_NOTES.md' --exclude 'CHECKSUMS.txt' --exclude 'php*.xml*' --exclude '*.zip' ./ build/assesscraft/
          cd build && zip -qr assesscraft-free-0.18.2.zip assesscraft
      - run: unzip -t build/assesscraft-free-0.18.2.zip
      - name: Ensure Free package boundaries
        run: |
          ! unzip -l build/assesscraft-free-0.18.2.zip | grep -E '(assesscraft-pro|/tests/|/docs/|/\.wordpress-org/|composer\.json|phpunit\.xml|phpcs\.xml|RELEASE_NOTES\.md|CHECKSUMS\.txt)'

  plugin-check:
    name: WordPress Plugin Check — Free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact Free release contents
        run: |
          mkdir -p build/assesscraft
          rsync -a --exclude '.git' --exclude '.gitignore' --exclude '.editorconfig' --exclude '.github/' --exclude '.wordpress-org/' --exclude 'assesscraft-pro/' --exclude 'build/' --exclude 'docs/' --exclude 'tests/' --exclude 'composer.*' --exclude 'README.md' --exclude 'RELEASE_NOTES.md' --exclude 'CHECKSUMS.txt' --exclude 'php*.xml*' --exclude '*.zip' ./ build/assesscraft/
      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/assesscraft'

  pro-package:
    name: Pro package regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Pro package
        run: |
          mkdir -p build/assesscraft-pro
          rsync -a --exclude '.git' --exclude '.DS_Store' --exclude '*.zip' assesscraft-pro/ build/assesscraft-pro/
          cd build && zip -qr assesscraft-pro-0.1.0-alpha.1.zip assesscraft-pro
      - name: Verify Pro package
        run: |
          unzip -t build/assesscraft-pro-0.1.0-alpha.1.zip
          unzip -p build/assesscraft-pro-0.1.0-alpha.1.zip assesscraft-pro/assesscraft-pro.php | grep -Eq '^ \* Version:[[:space:]]+0\.1\.0-alpha\.1$'
          unzip -p build/assesscraft-pro-0.1.0-alpha.1.zip assesscraft-pro/assesscraft-pro.php | grep -Fq 'Requires Plugins: assesscraft'
          ! unzip -l build/assesscraft-pro-0.1.0-alpha.1.zip | grep -E '(/tests/|/docs/|composer\.(json|lock)|phpunit\.xml|phpcs\.xml)'

  pro-plugin-check:
    name: WordPress Plugin Check — Pro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact Pro release contents
        run: |
          mkdir -p build/assesscraft-pro
          rsync -a --exclude '.git' --exclude '.DS_Store' --exclude '*.zip' assesscraft-pro/ build/assesscraft-pro/
      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/assesscraft-pro'
